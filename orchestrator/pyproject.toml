[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wap-runtime"
version = "0.6.0"
description = "Runtime self-hosted de l’orchestrateur workflow-agents-pack."
requires-python = ">=3.10"
dependencies = ['tomli>=2; python_version < "3.11"']

[project.optional-dependencies]
# Service HTTP (`wap-runtime serve`), installé dans l’image depuis requirements.txt ;
# la CLI de l’hôte n’en a pas besoin.
serve = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "websockets>=13"]
dev = ["pytest", "wap-runtime[serve]"]

[project.scripts]
wap-runtime = "wap_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
