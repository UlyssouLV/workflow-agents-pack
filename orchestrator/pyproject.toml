[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wap-runtime"
version = "0.2.0"
description = "Runtime self-hosted de l’orchestrateur workflow-agents-pack."
requires-python = ">=3.10"
dependencies = ['tomli>=2; python_version < "3.11"']

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
wap-runtime = "wap_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
