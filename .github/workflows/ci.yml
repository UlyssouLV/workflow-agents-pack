# CI du canal orchestrateur (ADR 0012) : toute PR vers la base d’intégration, sans filtre de chemins.
# Les suites gardent le faux `docker` des tests : pas de Docker Engine requis.
name: CI

on:
  pull_request:
    branches: [feat/runtime-orchestrator]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Dépendances verrouillées par hash (comme l’image), puis le paquet en editable sans résolution.
      - run: |
          pip install --require-hashes --only-binary :all: \
            -r requirements-build.txt -r requirements.txt -r requirements-test.txt
      - run: pip install --no-deps --no-build-isolation -e .
      - run: pytest --cov --cov-report=term --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-pytest
          path: orchestrator/coverage.xml
          if-no-files-found: error

  vitest:
    name: vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator/cockpit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Même Node que l’étape cockpit du Dockerfile.
          node-version: "24"
          cache: npm
          cache-dependency-path: orchestrator/cockpit/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-vitest
          path: orchestrator/cockpit/coverage/lcov.info
          if-no-files-found: error

  sonar:
    name: sonar
    needs: [pytest, vitest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : blame et code neuf de la PR.
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-pytest
          path: orchestrator
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-vitest
          path: orchestrator/cockpit/coverage
      # Les rapports sont relatifs à leur suite (pyproject.toml, vite.config.ts) ; Sonar résout depuis
      # la racine du dépôt (reportPaths de sonar-project.properties). Seul endroit qui réécrit les chemins.
      - run: |
          sed -i 's#filename="src/#filename="orchestrator/src/#' orchestrator/coverage.xml
          sed -i 's#^SF:src/#SF:orchestrator/cockpit/src/#' orchestrator/cockpit/coverage/lcov.info
      # Même projet que `/qg` ; `sonar.qualitygate.wait` fait échouer le job si le gate n’est pas OK.
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # Staging (ADR 0013) : CI verte → images au SHA de tête de la PR (pas le merge-ref), pour que la
  # Release posée sur ce SHA retrouve son :sha-<sha>. Rien pour une PR de fork (code non relu).
  # Paquets publics : ghcr les crée en privé ; geste manuel unique décrit dans le README.
  images:
    name: images
    needs: [pytest, vitest, sonar]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash orchestrator/scripts/publier-images-staging.sh "$SHA"
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
