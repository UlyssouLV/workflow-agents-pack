<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maquette cockpit HéphaïstOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Maquette 0.8.1 : coque à barre latérale + en-tête de page collant ; trois directions = trois jeux de tokens. */
:root {
  color-scheme: dark;
  /* Direction A — Forge (défaut) */
  --bg: #07080b;
  --surface: #0e1016;
  --surface-2: #151822;
  --surface-3: #1c2030;
  --line: #232838;
  --fg: #eceef4;
  --muted: #8a90a2;
  --faint: #5b6174;
  --accent: #ff7a1a;
  --accent-fg: #1a0b00;
  --attn: #ff7a1a;
  --agent: #3d8bff;
  --pilot: #8b7bff;
  --ok: #3ccb7f;
  --ko: #f0524a;
  --neutral: #6b7184;
  --glow: 0 0 0 1px color-mix(in srgb, var(--attn) 45%, transparent), 0 0 18px -4px color-mix(in srgb, var(--attn) 55%, transparent);
  --term-bg: #05060a;
  --radius: 8px;
  --font-display: "Saira", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --display-tracking: 0.01em;
  --main-pattern: none;
}
:root[data-dir="reseau"] {
  --bg: #060a14;
  --surface: #0b1120;
  --surface-2: #111a2d;
  --surface-3: #18233b;
  --line: #1d2a44;
  --fg: #e6edfb;
  --muted: #8593b1;
  --faint: #56627e;
  --accent: #2f8cff;
  --accent-fg: #ffffff;
  --attn: #ff8a2a;
  --agent: #29c4e8;
  --pilot: #8f7dff;
  --ok: #36c98a;
  --ko: #f25a5a;
  --neutral: #66728c;
  --glow: 0 0 0 1px color-mix(in srgb, var(--attn) 40%, transparent);
  --term-bg: #040812;
  --radius: 6px;
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --display-tracking: -0.01em;
  --main-pattern: radial-gradient(color-mix(in srgb, var(--accent) 14%, transparent) 1px, transparent 1px);
}
:root[data-dir="atelier"] {
  --bg: #111113;
  --surface: #17171a;
  --surface-2: #1e1e22;
  --surface-3: #26262b;
  --line: #2b2b31;
  --fg: #ededef;
  --muted: #8e8e97;
  --faint: #5e5e66;
  --accent: #f4f4f5;
  --accent-fg: #111113;
  --attn: #ff8b3d;
  --agent: #5b9cf5;
  --pilot: #a094f0;
  --ok: #4cc38a;
  --ko: #ec5d57;
  --neutral: #6e6e78;
  --glow: none;
  --term-bg: #0b0b0d;
  --radius: 10px;
  --font-display: "Geist", system-ui, sans-serif;
  --font-body: "Geist", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --display-tracking: -0.02em;
  --main-pattern: none;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--surface);
}
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[data-dir="atelier"] :focus-visible { outline-color: var(--attn); }
code, .mono { font-family: var(--font-mono); font-size: 0.92em; }
h1, h2, h3 { font-family: var(--font-display); letter-spacing: var(--display-tracking); margin: 0; text-wrap: balance; }
.tabnum { font-variant-numeric: tabular-nums; }

/* ── Barre de maquette (hors produit) ── */
.mock-bar {
  position: relative; z-index: 40;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: repeating-linear-gradient(135deg, var(--surface-2) 0 10px, var(--surface) 10px 20px);
  border-bottom: 1px dashed var(--line);
  font-size: 12px; color: var(--muted);
}
.mock-bar strong { color: var(--fg); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 11px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--bg); }
.seg button { border: 0; background: none; padding: 4px 12px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 600; }
.mock-bar select { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
.mock-bar .grow { flex: 1; }

/* ── Coque ── */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh;
  display: flex; flex-direction: column; gap: 20px;
  padding: 18px 14px; background: var(--surface); border-right: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; padding: 0 4px; }
.brand img { width: 40px; height: 40px; border-radius: 10px; }
.brand .wm { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: var(--display-tracking); line-height: 1; }
.brand .wm b { color: var(--attn); font-weight: 700; }
[data-dir="reseau"] .brand .wm b { color: var(--accent); }
.brand small { display: block; font-size: 9.5px; letter-spacing: 0.22em; color: var(--muted); margin-top: 4px; font-family: var(--font-body); }
.ember { height: 1px; background: linear-gradient(90deg, transparent, var(--attn), var(--agent), transparent); opacity: .55; }
[data-dir="atelier"] .ember { background: var(--line); opacity: 1; }
.nav { display: grid; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px;
  text-decoration: none; color: var(--muted); font-weight: 500;
}
.nav a:hover { background: var(--surface-2); color: var(--fg); }
.nav a[aria-current="page"] { background: var(--surface-3); color: var(--fg); }
.nav .count {
  margin-left: auto; min-width: 22px; padding: 0 7px; border-radius: 999px; text-align: center;
  background: var(--attn); color: #160800; font-size: 12px; font-weight: 700; box-shadow: var(--glow);
}
.side-label { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); padding: 0 10px; margin-bottom: 6px; }
.agents-list { display: grid; gap: 6px; padding: 0 10px; font-size: 13px; }
.agents-list li { display: flex; align-items: center; gap: 8px; list-style: none; }
.agents-list ul { margin: 0; padding: 0; }
.agents-list .hint { font-size: 11.5px; color: var(--muted); padding-left: 16px; }
.agents-list .hint code { color: var(--fg); }
.side-foot { margin-top: auto; display: grid; gap: 10px; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.side-foot .who { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.side-foot .who strong { color: var(--fg); font-weight: 500; }

.topbar { display: none; }
.main { min-width: 0; background-image: var(--main-pattern); background-size: 22px 22px; }
.page-head {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
  padding-block: 16px;
  padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.page-head .titles { min-width: 0; flex: 1; }
.eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.eyebrow a { text-decoration: none; }
.eyebrow a:hover { color: var(--fg); }
.page-head h1 { font-size: 24px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.page-head .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.content { display: grid; gap: 20px; padding-block: 24px 48px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); max-width: 1320px; }

/* ── Primitives ── */
.btn {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px;
  border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
  font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--surface-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--ko); border-color: color-mix(in srgb, var(--ko) 45%, var(--line)); background: color-mix(in srgb, var(--ko) 8%, transparent); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--surface-2); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card-head h2 { font-size: 15px; font-weight: 600; }
.card-head .sub { color: var(--muted); font-size: 12.5px; }
.card-head .end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card-body { padding: 16px 18px; }

.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px;
  font-size: 12px; font-weight: 500; white-space: nowrap; text-decoration: none;
  border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
  background: color-mix(in srgb, var(--c) 13%, transparent); color: color-mix(in srgb, var(--c) 78%, var(--fg));
}
a.pill:hover { background: color-mix(in srgb, var(--c) 22%, transparent); }
.pill.attn { --c: var(--attn); box-shadow: var(--glow); }
.pill.agent { --c: var(--agent); }
.pill.pilot { --c: var(--pilot); }
.pill.pilot-pause { --c: var(--pilot); opacity: .75; border-style: dashed; }
.pill.ok { --c: var(--ok); }
.pill.ko { --c: var(--ko); }
.pill.neutral { --c: var(--neutral); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--neutral)); flex: none; }
.dot.live { position: relative; }
.dot.live::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--c); opacity: 0; animation: ping 1.8s ease-out infinite; }
@keyframes ping { 0% { transform: scale(.6); opacity: .8; } 100% { transform: scale(1.8); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .dot.live::after { animation: none; } }
.chip { display: inline-block; padding: 1px 7px; border-radius: 4px; background: var(--surface-3); color: var(--muted); font-size: 11.5px; font-family: var(--font-mono); }

.progress { display: flex; align-items: center; gap: 10px; min-width: 120px; }
.progress .track { flex: 1; height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.progress .fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--agent), var(--accent)); }
[data-dir="atelier"] .progress .fill { background: var(--fg); }
[data-dir="reseau"] .progress .fill { background: var(--accent); }
.progress span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

.alert { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line)); background: color-mix(in srgb, var(--c) 9%, var(--surface)); }
.alert .ico { color: var(--c); margin-top: 2px; }
.alert p { margin: 0; }
.alert.attn { --c: var(--attn); }
.alert.ko { --c: var(--ko); }
.alert.agent { --c: var(--agent); }

/* ── Tableaux ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); font-weight: 500; padding: 10px 18px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tr.row-link { cursor: pointer; }
tr.row-link:hover td { background: var(--surface-2); }
tr.needs td:first-child { box-shadow: inset 2px 0 0 var(--attn); }
.repo-name { font-weight: 600; text-decoration: none; }
.repo-name:hover { text-decoration: underline; text-underline-offset: 3px; }
.owner { color: var(--muted); font-weight: 400; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

.summary { display: flex; flex-wrap: wrap; gap: 10px; }
.summary .s { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); min-width: 0; }
.summary .s b { font-family: var(--font-display); font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
.summary .s span { color: var(--muted); font-size: 12.5px; }
.summary .s.attn { border-color: color-mix(in srgb, var(--attn) 45%, var(--line)); box-shadow: var(--glow); }
.summary .s.attn b { color: var(--attn); }
.summary .s.agent b { color: var(--agent); }
.summary .s.pilot b { color: var(--pilot); }

.cards-mobile { display: none; }
.closed summary { display: flex; align-items: center; gap: 8px; padding: 10px 18px; cursor: pointer; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); list-style: none; }
.closed summary::-webkit-details-marker { display: none; }
.closed summary:hover { color: var(--fg); }
.closed[open] summary .ico { transform: rotate(90deg); }
.group-attn { border-color: color-mix(in srgb, var(--attn) 40%, var(--line)); }
.card .desktop-table { border-radius: 0 0 var(--radius) var(--radius); }

/* ── Détail ── */
.grid-detail { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.stack { display: grid; gap: 20px; min-width: 0; }
.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-size: 12px; color: var(--muted); font-weight: 500; }
.select { height: 34px; width: 100%; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); }
.form { display: grid; gap: 14px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.switch-row p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.switch { width: 38px; height: 22px; border-radius: 999px; border: 0; background: var(--surface-3); position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--pilot); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }
.divider { height: 1px; background: var(--line); }
.reason { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: flex-start; }
.reason a { color: var(--agent); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.signals { display: flex; flex-wrap: wrap; gap: 6px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checks li { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.checks li a { text-decoration: none; }
.checks li a:hover { text-decoration: underline; }
.pr { display: grid; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 var(--radius) var(--radius); }
.pr-title { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 500; }
.pr-title a { text-decoration: none; }
.bug-list { list-style: none; margin: 0; padding: 0; display: grid; }
.bug-list li { padding: 10px 18px; border-top: 1px solid var(--line); }
.bug-list li:first-child { border-top: 0; }
.bug-list a { text-decoration: none; }
.bug-list a:hover { text-decoration: underline; }
.num { color: var(--muted); font-family: var(--font-mono); font-size: 12.5px; margin-right: 6px; }

/* ── Session ── */
.meta { display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 14px 18px; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta .k { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.meta .v { font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
.chain { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 14px; font-size: 12.5px; }
.chain a { color: var(--agent); text-decoration: none; display: inline-flex; gap: 4px; align-items: center; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; color: var(--muted); cursor: pointer; font-weight: 500; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
[data-dir="atelier"] .tabs button[aria-selected="true"] { border-bottom-color: var(--attn); }
.term { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--term-bg); }
.term-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 12.5px; }
.term-bar .end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.term pre { margin: 0; padding: 14px 16px; height: min(58vh, 520px); overflow: auto; font: 13px/1.55 var(--font-mono); color: #d6d9e2; white-space: pre-wrap; overflow-wrap: anywhere; }
.t-dim { color: #6f7588; } .t-or { color: var(--attn); } .t-bl { color: var(--agent); } .t-gr { color: var(--ok); } .t-vi { color: var(--pilot); } .t-wh { color: #ffffff; font-weight: 500; }
.cursor { display: inline-block; width: 8px; height: 15px; background: var(--fg); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
.player { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 14px; background: var(--surface); border-top: 1px solid var(--line); }
.player .track { flex: 1; min-width: 120px; height: 4px; border-radius: 999px; background: var(--surface-3); position: relative; }
.player .track i { position: absolute; inset: 0 62% 0 0; background: var(--agent); border-radius: inherit; }
.player .track i::after { content: ""; position: absolute; right: -6px; top: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--fg); }

/* ── Codespace ── */
.cs-id { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 12.5px; color: var(--muted); }
.cs-id b { color: var(--fg); font-weight: 500; }
.cs-id a { color: var(--agent); text-decoration: none; }
.cs { display: grid; grid-template-columns: 260px minmax(0, 1fr); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; height: min(62vh, 560px); background: var(--term-bg); }
.tree { margin: 0; padding: 8px 0; list-style: none; overflow: auto; background: var(--surface); border-right: 1px solid var(--line); font-size: 12.5px; font-family: var(--font-mono); }
.tree ul { list-style: none; margin: 0; padding: 0; }
.tree li > span { display: flex; align-items: center; gap: 6px; padding: 3px 12px 3px calc(12px + var(--d, 0) * 14px); cursor: pointer; white-space: nowrap; }
.tree li > span:hover { background: var(--surface-2); }
.tree li.sel > span { background: var(--surface-3); }
.tree .ign > span { color: var(--faint); }
.tree .gone > span { color: var(--faint); font-style: italic; }
.tree .mk { margin-left: auto; font-weight: 600; font-size: 11px; }
.tree .M > span { color: #e5b454; } .tree .M .mk { color: #e5b454; }
.tree .A > span, .tree .U > span { color: var(--ok); } .tree .A .mk, .tree .U .mk { color: var(--ok); }
.tree .ico { width: 14px; height: 14px; opacity: .8; }
.editor { display: flex; flex-direction: column; min-width: 0; }
.ftabs { display: flex; align-items: stretch; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; }
.ftab { display: flex; align-items: center; gap: 6px; padding: 0 6px 0 12px; height: 34px; border-right: 1px solid var(--line); font-size: 12.5px; color: var(--muted); white-space: nowrap; font-family: var(--font-mono); }
.ftab[aria-selected="true"] { background: var(--term-bg); color: var(--fg); box-shadow: inset 0 2px 0 var(--accent); }
[data-dir="atelier"] .ftab[aria-selected="true"] { box-shadow: inset 0 2px 0 var(--attn); }
.ftab button { border: 0; background: none; color: var(--faint); cursor: pointer; width: 22px; height: 22px; border-radius: 4px; display: grid; place-items: center; }
.ftab button:hover { background: var(--surface-3); color: var(--fg); }
.ftabs .end { margin-left: auto; display: flex; align-items: center; padding: 0 8px; }
.code { margin: 0; overflow: auto; flex: 1; font: 12.5px/1.65 var(--font-mono); counter-reset: ln; padding: 8px 0; }
.code span.l { display: block; padding-right: 16px; white-space: pre; color: #c9cdd8; }
.code span.l::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 44px; padding-right: 14px; text-align: right; color: #464b5c; }
.code span.add { background: color-mix(in srgb, var(--ok) 13%, transparent); }
.code span.add::before { color: var(--ok); }
.code span.del { background: color-mix(in srgb, var(--ko) 13%, transparent); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ko) 50%, transparent); }

/* ── Connexion ── */
.login { min-height: 100vh; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: radial-gradient(ellipse 60% 45% at 50% 38%, color-mix(in srgb, var(--attn) 10%, transparent), transparent 70%), var(--bg); }

.input { height: 38px; width: 100%; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); }
.login-foot { font-size: 12px; color: var(--faint); text-align: center; }

/* ── Dialogue, toast, panneau mobile ── */
.overlay { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, #000 65%, transparent); display: grid; place-items: center; padding: 16px; }
.dialog { width: min(640px, 100%); max-height: 86vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 30px 80px -20px #000; display: grid; gap: 14px; padding: 22px; }
.dialog h2 { font-size: 18px; display: flex; gap: 10px; align-items: center; }

.dialog pre { margin: 0; max-height: 200px; overflow: auto; padding: 12px; border-radius: 6px; background: var(--term-bg); border: 1px solid var(--line); font: 12px/1.55 var(--font-mono); }

}

function ic(n, cls = "") {
  const parts = P[n].split("|").map((d) => {
    if (d.startsWith("c:")) { const [cx, cy, r] = d.slice(2).split(","); return `<circle cx="${cx}" cy="${cy}" r="${r}"/>`; }
    if (d.startsWith("r:")) { const [x, y, w, h, rx] = d.slice(2).split(","); return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/>`; }
    return `<path d="${d}"/>`;
  }).join("");
  return `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${parts}</svg>`;
}

  if (a === "inconnue") return `<span class="pill neutral"><span class="dot"></span>Inconnue</span>`;

  const m = { "Ouverte": "agent", "Terminée": "ok", "Enchaînée": "pilot", "Arrêtée": "neutral", "Interrompue": "neutral", "Échouée": "ko" };

function vSessions() {
  const groups = [];
  SESSIONS.forEach((x) => { let g = groups.find((y) => y.repo === x.repo); if (!g) groups.push(g = { repo: x.repo, items: [] }); g.items.push(x); });
  const rank = (g) => g.items.some((x) => x.act === "attend") ? 0 : g.items.some((x) => x.state === "Ouverte") ? 1 : 2;
  groups.sort((x, y) => rank(x) - rank(y));
  const tgt = (x) => x.state === "Ouverte" ? "terminal" : "terminee";
  const group = (g) => {
    const [o, n] = g.repo.split("/");
    const open = g.items.filter((x) => x.state === "Ouverte");
    const wait = open.filter((x) => x.act === "attend").length;
    const closed = g.items.filter((x) => x.state !== "Ouverte");
    const row = (x) => `<tr class="row-link" data-go="${tgt(x)}">
      <td><a href="#${tgt(x)}" data-go="${tgt(x)}">${x.title}</a></td>
      <td>${x.agent}${x.model !== "—" ? ` <span class="chip">${x.model}</span>` : ""}</td>
      <td class="small mono" style="max-width:240px;overflow-wrap:anywhere">${x.branch}</td>
      <td>${statePill(x.state)}</td><td>${x.state === "Ouverte" ? activityPill(x.act, x.skill) : `<span class="muted">—</span>`}</td></tr>`;
    const head = `<thead><tr><th>Titre</th><th>Agent</th><th>Branche</th><th>État</th><th>Activité</th></tr></thead>`;
    const cards = g.items.map((x) => `<a class="m-card" href="#${tgt(x)}" data-go="${tgt(x)}">
      <div class="top"><strong>${x.title}</strong>${statePill(x.state)}</div>
      <div class="small muted">${x.agent}${x.model !== "—" ? ` · ${x.model}` : ""} · <span class="mono">${x.branch}</span></div>
      ${x.state === "Ouverte" ? `<div>${activityPill(x.act, x.skill)}</div>` : ""}</a>`).join("");
    return `<section class="card ${wait ? "group-attn" : ""}" aria-label="Sessions de ${g.repo}">
      <div class="card-head"><h2><a href="#detail" data-go="detail" style="text-decoration:none"><span class="owner">${o}/</span>${n}</a></h2>
        <span class="sub">${g.items.length} session${g.items.length > 1 ? "s" : ""}</span>
        <div class="end">${wait ? `<span class="pill attn">${wait} réponse attendue</span>` : open.length ? `<span class="pill agent">${open.length} ouverte</span>` : `<span class="pill neutral">aucune ouverte</span>`}</div></div>
      ${open.length ? `<div class="table-wrap desktop-table"><table>${head}<tbody>${open.map(row).join("")}</tbody></table></div>` : ""}
      ${closed.length ? `<details class="closed desktop-table"><summary>${ic("chev")}${closed.length} session${closed.length > 1 ? "s" : ""} fermée${closed.length > 1 ? "s" : ""}</summary><div class="table-wrap"><table>${head}<tbody>${closed.map(row).join("")}</tbody></table></div></details>` : ""}
      <div class="cards-mobile" style="padding:12px">${cards}</div>
    </section>`;
  };
  return pageHead("Toutes les sessions · regroupées par repo", "Sessions") + `
  <div class="content">${groups.map(group).join("")}
    <p class="muted small" style="margin:0">Ordre : les repos qui attendent une réponse, puis ceux qui ont une session ouverte, puis les autres. Dans un repo : sessions ouvertes d’abord, puis les plus récentes.</p>
  </div>`;
}

function render() {
  document.documentElement.dataset.dir = S.dir === "forge" ? "" : S.dir;
  if (S.dir === "forge") delete document.documentElement.dataset.dir;
  document.querySelectorAll("#dirs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.dir === S.dir)));
  document.getElementById("screen-pick").value = S.screen;
  const scr = S.screen;
  let html;
  if (scr === "login") html = vLogin();
  else if (scr === "repos") html = shell(vRepos(), "repos");
  else if (scr === "detail" || scr === "clone") html = shell(vDetail(), "repos");
  else if (scr === "sessions") html = shell(vSessions(), "sessions");
  else if (scr === "terminal") html = shell(vTerminal(), "sessions");
  else if (scr === "codespace") html = shell(vCodespace(false), "sessions");
  else if (scr === "terminee") html = shell(vTerminee(), "sessions");
  else html = shell(vCodespace(true), "sessions");
  const toast = S.toast ? `<div class="toast" role="status">${ic("check")}${S.toast}</div>` : "";
  document.getElementById("app").innerHTML = html + modal() + toast;
}

function go(screen) {
  S.screen = screen; S.sheet = false; S.modal = screen === "clone" ? "clone" : null;
  try { history.replaceState(null, "", "#" + screen); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
let toastTimer;
function toast(msg) { S.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 2600); }

document.getElementById("screen-pick").innerHTML = SCREENS.map(([id, l]) => `<option value="${id}">${l}</option>`).join("");
document.getElementById("screen-pick").addEventListener("change", (e) => go(e.target.value));
document.getElementById("dirs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  S.dir = b.dataset.dir; try { localStorage.setItem("heph-dir", S.dir); } catch (err) {}
  render();
});
document.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]");
  if (act) {
    const a = act.dataset.act;
    if (a === "sheet") { S.sheet = !S.sheet; render(); }
    else if (a === "pilot") { S.pilot = !S.pilot; toast(S.pilot ? "Pilote activé" : "Pilote désactivé"); }
    else if (a === "launch") { S.modal = "clone"; render(); }
    else if (a === "stop") { S.modal = "stop"; render(); }
    else if (a === "close") { S.modal = null; render(); }
    else if (a === "diff") { S.diff = !S.diff; render(); }
    else if (a === "ro") { S.ro = !S.ro; render(); }
    return;
  }
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); go(g.dataset.go); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (S.modal || S.sheet)) { S.modal = null; S.sheet = false; render(); } });


const h = (location.hash || "").slice(1);
if (SCREENS.some(([id]) => id === h)) S.screen = h;
S.modal = S.screen === "clone" ? "clone" : null;
render();
</script>
