# Géré par workflow-agents-pack (update-from-pack.sh --with-docs le rafraîchit). Pour le personnaliser, supprime cette ligne : le pack ne le touchera plus.
name: Deploy docs

# À chaque push sur main (pas seulement la doc) : le site publie aussi les
# compteurs de commits lus par les badges du README (static/stats/).
# Aucun commit de bot sur main : les aperçus README sont produits sur la
# branche de version (finaliser-la-version).
on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # L'environnement github-pages n'accepte que main : un run déclenché par le tag
  # d'une release ne peut pas déployer. On relance donc le même workflow sur main.
  relancer-sur-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Relancer Deploy docs sur main
        run: gh workflow run deploy-docs.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    if: github.event_name != 'release'
    uses: ./.github/workflows/build-docs.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      upload-pages: true

  deploy:
    if: github.event_name != 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
