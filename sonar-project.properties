# Analyse CI (job `sonar`, .github/workflows/ci.yml) : le code produit sous orchestrator/, pas l’arbre pack.
# Hôte, jeton et clé de projet viennent des secrets Actions (mêmes valeurs que `.env` pour `/qg`).
sonar.organization=ulyssoulv

sonar.sources=orchestrator
sonar.tests=orchestrator/tests,orchestrator/cockpit/tests
sonar.exclusions=orchestrator/tests/**,orchestrator/cockpit/tests/**,**/node_modules/**,**/dist/**,**/coverage/**,**/.venv/**
sonar.sourceEncoding=UTF-8

sonar.python.version=3.12
# Rapports produits par les jobs pytest et vitest ; chemins réécrits vers la racine dans le job `sonar`.
sonar.python.coverage.reportPaths=orchestrator/coverage.xml
sonar.javascript.lcov.reportPaths=orchestrator/cockpit/coverage/lcov.info
# Composants shadcn/ui copiés tels quels (ADR 0015) : couverts par les tests des écrans qui les
# utilisent, pas un par un ; leurs gabarits Radix se ressemblent (dialog, alert-dialog, sheet).
sonar.coverage.exclusions=orchestrator/cockpit/src/components/ui/**
sonar.cpd.exclusions=orchestrator/cockpit/src/components/ui/**
